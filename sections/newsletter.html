<section id="newsletter" class="py-12 md:py-16 px-4 max-w-7xl mx-auto">
  <div class="max-w-2xl mx-auto border border-rule rounded p-6 md:p-8 bg-surface text-center">
    <h2 class="display text-2xl md:text-3xl mb-3">Get Updates When We Add New Sites</h2>
    <p class="text-stone text-sm leading-relaxed mb-5 max-w-lg mx-auto">We are continuously adding Chinese historical sites to our database. No spam. No ads. Just new verifications and route updates.</p>
    <form class="flex flex-col sm:flex-row gap-2 max-w-md mx-auto" onsubmit="event.preventDefault(); var e=document.getElementById('nl-email'); var m=document.getElementById('nl-msg'); if(e.value){m.textContent='Thanks! We will be in touch.';m.className='text-xs text-tag-green mt-2';e.value='';}else{m.textContent='Please enter an email address.';m.className='text-xs text-vermillion mt-2';}">
      <input type="email" id="nl-email" placeholder="your@email.com" class="flex-1 px-4 py-2 border border-rule rounded bg-paper text-ink placeholder:text-stone text-sm focus:outline-none focus:border-vermillion transition">
      <button type="submit" class="px-6 py-2 bg-vermillion text-white text-sm font-medium rounded hover:bg-accent-hover transition whitespace-nowrap">Subscribe</button>
    </form>
    <p id="nl-msg" class="text-xs text-stone mt-2">No spam. Unsubscribe anytime.</p>
  </div>
</section>
